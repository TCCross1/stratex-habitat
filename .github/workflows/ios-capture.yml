name: ios-capture (StratexRealityCapture)

# Native Swift build/test for the LiDAR capture module. This is the ONLY place a
# real Apple toolchain is available — the Emergent dev/CI Linux container cannot
# build Swift/RoomPlan (native build/run is classified BLOCKED there).
#
# On the macOS runner, RoomPlan/ARKit (iOS-only) are excluded via `#if canImport`
# guards, so `swift build`/`swift test` compile the portable module and run the
# deterministic Scan Quality Guardian tests (which mirror the backend verdicts).

on:
  push:
    branches: [ "main", "emergent/**" ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-capture.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch: {}

jobs:
  swift-build-test:
    name: swift build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: swift --version
      - name: Build package
        working-directory: ios/StratexRealityCapture
        run: swift build -v
      - name: Run Guardian determinism tests
        working-directory: ios/StratexRealityCapture
        run: swift test -v
